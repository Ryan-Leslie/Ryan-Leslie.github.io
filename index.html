<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Leslie | Digital Portfolio</title>
    <style>
        /* Modern CSS Variables & Styling */
        :root {
            --primary-color: #0ea5e9; /* Medical Sky Blue */
            --dark-color: #0f172a;    /* Deep Slate */
            --light-bg: #f8fafc;     /* Clean Off-White */
            --text-color: #334155;   /* Soft Black/Gray */
            --border-color: #e2e8f0; /* Light Gray */
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #ffffff;
        }

        /* Navigation Bar */
        header {
            background: var(--dark-color);
            color: #fff;
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        nav {
            text-align: center;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            border-bottom: 2px solid var(--primary-color);
        }

        /* Fixed Section Layout */
        section {
            width: 100%;
            box-sizing: border-box;
            padding: 4rem 0;
        }

        /* Alternating Background Colors */
        section:nth-child(even) {
            background-color: var(--light-bg);
        }

        /* Container that keeps content centered safely */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
            box-sizing: border-box;
        }

        h2 {
            color: var(--dark-color);
            font-size: 1.75rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 0.5rem;
            display: inline-block;
            margin-top: 0;
        }

        /* Profile Split Layout */
        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            margin-bottom: 2rem;
        }

        .profile-text {
            flex: 1;
        }

        .profile-image-container {
            flex-shrink: 0;
        }

        .profile-img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 50%; /* Makes the photo a clean circle */
            border: 4px solid #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        /* Stats/Highlights Layout */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: #fff;
            border-top: 4px solid var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 1.5rem;
            text-align: center;
            border-radius: 4px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 2.2rem;
            color: var(--dark-color);
        }

        .stat-card p {
            margin: 0.5rem 0 0 0;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }
